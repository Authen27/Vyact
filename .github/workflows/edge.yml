name: Edge

# T5a (audit XC-ARC-09, INT-PAR-11): the Edge Functions under Deno itself. The automation gates in ci.yml
# already type-check them with TypeScript (Deno's globals stubbed); this job is the authoritative check of
# Deno's own types and lint, and loads the bundled engine the way the Edge runtime does.
# Minutes budget: runs only when Edge code (or this check) changes, with a short timeout.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/deno-smoke.ts'
      - '.github/workflows/edge.yml'
  pull_request:
    branches: [main]
    # Same list as push: above. Keep the two in step.
    paths:
      - 'supabase/functions/**'
      - 'scripts/deno-smoke.ts'
      - '.github/workflows/edge.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deno:
    name: Edge · deno check, lint and bundle smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 8   # normally ~1 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: deno check (every function)
        run: deno check supabase/functions/*/index.ts
      # Each step reports even when an earlier one failed, so one run shows everything that is wrong.
      # Not linted: the generated engine bundle (esbuild output; its source is linted with the app), and two
      # style rules. no-import-prefix wants an import map; the functions import by URL, as Supabase deploys them.
      # no-explicit-any flags the untyped Meta webhook payloads; the strict TypeScript gate already covers types.
      - name: deno lint
        if: ${{ !cancelled() }}
        run: >-
          deno lint supabase/functions
          --ignore=supabase/functions/_shared/agent/engine.generated.js
          --rules-exclude=no-explicit-any,no-import-prefix
      - name: The engine bundle and shared modules run under Deno
        if: ${{ !cancelled() }}
        run: deno run --allow-env --allow-read scripts/deno-smoke.ts
