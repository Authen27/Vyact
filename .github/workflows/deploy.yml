name: Deploy

# Auto-deploy both apps to Vercel on push to main, after applying any
# pending Supabase migrations.
# Setup needed once (see DEPLOY.md):
#   • In each Vercel project: Settings → Git → connect this repo
#   • In GitHub: add these secrets at Settings → Secrets and variables → Actions:
#       VERCEL_TOKEN              (account-level, https://vercel.com/account/tokens)
#       VERCEL_ORG_ID             (team or personal scope id)
#       VERCEL_CONSUMER_PROJECT_ID
#       VERCEL_ADMIN_PROJECT_ID
#       VITE_SUPABASE_URL         (Supabase project URL — injected at build time)
#       VITE_SUPABASE_ANON_KEY    (Supabase anon key — injected at build time)
#       VITE_APP_URL              (consumer app URL, e.g. https://react-taupe-xi.vercel.app)
#       SUPABASE_ACCESS_TOKEN     (personal access token — https://supabase.com/dashboard/account/tokens)
#       SUPABASE_PROJECT_REF      (the ref shown in the project URL, e.g. abcd1234efgh5678)
#       SUPABASE_DB_PASSWORD      (DB password for the production project — Settings → Database)

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual trigger from GitHub UI

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # TD-20 (PR #16) — apply any pending Supabase migrations BEFORE the apps
  # deploy. `supabase db push` is idempotent against the remote
  # `supabase_migrations.schema_migrations` tracker: it only applies
  # migrations the tracker hasn't already recorded. The TD-20 baseline
  # itself is pre-inserted into the tracker so production isn't touched
  # on the first run after PR #16.
  db-migrations:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    environment: production-database
    # 🔴 NO LONGER BEST-EFFORT (v10.20.5).
    #
    # This carried `continue-on-error: true` on the reasoning that a Supabase
    # auth hiccup must never block an app deploy. In practice it failed on a
    # stale SUPABASE_ACCESS_TOKEN for FOUR consecutive releases while the
    # workflow reported overall success — so nobody noticed, and the safety
    # valve had become the normal state.
    #
    # The risk that makes this unacceptable: a release whose frontend expects
    # new schema would ship even though the migration never ran, and nothing
    # would say so. That is the same silent-success shape as the defects this
    # stabilisation programme has been fixing.
    #
    # A failure here now stops the release. Refresh the token when it expires.
    steps:
      - uses: actions/checkout@v4
      # NOTE: do NOT use `version: latest` — it hits the unauthenticated GitHub
      # API to look up the latest release and gets rate-limited on shared
      # runners. Pin a specific CLI version and bump it deliberately.
      - uses: supabase/setup-cli@v1
        with: { version: 1.226.4 }
      - name: Validate migrations directory (CI-style gate)
        run: node scripts/db-migrations-check.mjs
      # Normalise the token before the CLI sees it. Pasting a secret into the
      # GitHub UI very easily carries a trailing newline or a leading space, and
      # the CLI's only response is "Invalid access token format", which names
      # neither the secret nor the cause. Trim it, then say precisely what is
      # wrong if it still doesn't match — a bad token should cost one glance,
      # not one bisect.
      - name: Normalise + validate SUPABASE_ACCESS_TOKEN
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::error title=SUPABASE_ACCESS_TOKEN is not set::Add it at Settings → Secrets and variables → Actions. Mint one at https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          if ! printf '%s' "$TOKEN" | grep -qE '^sbp_[0-9a-f]{40}$'; then
            echo "::error title=SUPABASE_ACCESS_TOKEN is malformed::After trimming whitespace the stored value is ${#TOKEN} characters; a personal access token is 44 (sbp_ + 40 hex). Re-copy it from https://supabase.com/dashboard/account/tokens with no surrounding quotes or trailing newline. NOTE: this is the ACCOUNT-level token — not the anon key, the service_role key, or SUPABASE_DB_PASSWORD."
            exit 1
          fi
          # Mask the trimmed form too: GitHub only auto-masks the exact stored
          # value, so if the stored one had whitespace the trimmed core would
          # otherwise be unmasked in any later log line.
          echo "::add-mask::$TOKEN"
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Access token format OK."
      # These two inherit the normalised SUPABASE_ACCESS_TOKEN from GITHUB_ENV.
      # Do NOT re-add an `env:` block for it here — that would reinstate the raw
      # secret and undo the trim above.
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Push pending migrations
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --include-all

  # Deploy the Supabase Edge Functions. Gated with db-migrations since v10.20.5
  # (it was best-effort, and was silently failing on a stale token for four
  # releases). The deploy itself is idempotent; the runtime WHATSAPP_* /
  # ASK_VYACT_* secrets are configured separately via `supabase secrets set`
  # (see whatsapp-connection-setup.md). The webhook MUST be --no-verify-jwt
  # (Meta has no Supabase JWT); the OTP functions MUST verify JWT (they identify
  # the user), and so MUST `ask-vyact` — it is a paid endpoint that acts as the
  # signed-in caller, and it additionally refuses service-role/anon tokens in
  # code. Deploying `ask-vyact` is SAFE while the agent is off: `ai_model_configs`
  # ships empty with `enabled` defaulting false, so the gateway resolves no model,
  # calls no provider, spends nothing and writes no ai_usage row.
  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    needs: db-migrations
    runs-on: ubuntu-latest
    environment: production-database
    # Gated with db-migrations (v10.20.5) — see the note on that job.
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 1.226.4 }
      # Same normalisation as the db-migrations job — see the note there.
      - name: Normalise SUPABASE_ACCESS_TOKEN
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$TOKEN"
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Deploy WhatsApp functions
        run: |
          supabase functions deploy whatsapp-webhook --no-verify-jwt
          supabase functions deploy whatsapp-send-otp
          supabase functions deploy whatsapp-verify-otp
          supabase functions deploy whatsapp-notify
      - name: Deploy agent gateway
        # WITH JWT verification (default). Inert until a super-admin enables an
        # ai_model_configs row.
        run: supabase functions deploy ask-vyact

  consumer:
    # TD-33 (v10.22.4) — also waits for the Edge Functions. Needing only
    # db-migrations let this job run in PARALLEL with deploy-edge-functions, so a
    # consumer calling a new function action could go live before the function
    # did (v10.22.2's WhatsApp status/unlink were the first real case). If the
    # functions fail to deploy, the consumer that depends on them does not ship.
    needs: [db-migrations, deploy-edge-functions]
    # No longer if: always() — the app must not ship when its migrations did not.
    name: Deploy consumer (react/)
    runs-on: ubuntu-latest
    environment:
      name: production-consumer
      url: ${{ steps.deploy.outputs.url }}
    defaults: { run: { working-directory: react } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: react/package-lock.json }
      - run: npm install -g vercel@latest
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}
      - name: Build
        # Supabase config comes from the committed react/.env.production
        # (public URL + publishable key). We deliberately do NOT inject
        # VITE_SUPABASE_* from GitHub secrets here: Vite gives shell env vars
        # higher precedence than .env files, so a missing/empty secret would
        # silently override the committed values and ship a local-only "dummy
        # data" build (root cause of the consumer DB-disconnect, 2026-05-29).
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}
      - name: Deploy
        id: deploy
        run: |
          # `vercel deploy --prod` promotes the build to THIS project's own
          # production domain (vyact-twentyx.vercel.app), which Vercel
          # updates automatically — no manual alias step needed. (Note: the
          # historical react-taupe-xi.vercel.app URL lives on a *different*
          # Vercel account and is not reachable from this project's token.)
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Consumer deployed::$URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CONSUMER_PROJECT_ID }}

  admin:
    needs: db-migrations
    # No longer if: always() — the app must not ship when its migrations did not.
    name: Deploy admin (admin/)
    runs-on: ubuntu-latest
    environment:
      name: production-admin
      url: ${{ steps.deploy.outputs.url }}
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: admin/package-lock.json }
      - run: npm install -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
      # Supabase config comes from the committed admin/.env.production
      # (public URL + publishable key) — not from GitHub secrets (see the
      # consumer Build step note on Vite env precedence).
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
      - id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Admin deployed::$URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
