name: Deploy

# Applies pending Supabase migrations, then deploys the Supabase Edge Functions,
# on every push to main.
#
# The apps are NOT deployed here. vyact.app and admin.vyact.app are built and
# deployed by Vercel's GitHub connection on the authen27 projects `vyact` and
# `vyact-admin` (docs/ENVIRONMENTS.md). This workflow used to carry
# `consumer` and `admin` jobs (vercel build/deploy --prebuilt --prod). Their
# VERCEL_* secrets pointed at the old `bhushandandolus-projects` team, so they
# never reached vyact.app. From 30 Sep 2026 they hung at "Building…" until the
# job timeout, spending Actions minutes. Removed 1 Oct 2026.
#
# Secrets used (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  (personal access token — https://supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   (the production project ref)
#   SUPABASE_DB_PASSWORD   (DB password for the production project — Settings → Database)
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_CONSUMER_PROJECT_ID and VERCEL_ADMIN_PROJECT_ID
# are no longer read by any workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual trigger from GitHub UI

# W8d (audit OPS-07): read-only token. No job writes to the repository, issues or PRs.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # TD-20 (PR #16) — apply any pending Supabase migrations on every push to
  # main. `supabase db push` is idempotent against the remote
  # `supabase_migrations.schema_migrations` tracker: it only applies
  # migrations the tracker hasn't already recorded. The TD-20 baseline
  # itself is pre-inserted into the tracker so production isn't touched
  # on the first run after PR #16.
  db-migrations:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the 6-hour default would drain the Actions budget if a step hangs
    environment: production-database
    # 🔴 NO LONGER BEST-EFFORT (v10.20.5).
    #
    # This carried `continue-on-error: true` on the reasoning that a Supabase
    # auth hiccup must never block an app deploy. In practice it failed on a
    # stale SUPABASE_ACCESS_TOKEN for FOUR consecutive releases while the
    # workflow reported overall success — so nobody noticed, and the safety
    # valve had become the normal state.
    #
    # The risk that makes this unacceptable: a release whose frontend expects
    # new schema would ship even though the migration never ran, and nothing
    # would say so. That is the same silent-success shape as the defects this
    # stabilisation programme has been fixing.
    #
    # A failure here fails the run and stops the Edge Functions deploy. Refresh
    # the token when it expires.
    #
    # ⚠️ It does NOT hold back the app (1 Oct 2026). Vercel's GitHub connection
    # builds and publishes vyact.app on the same push, in parallel, whatever
    # happens here. A release whose frontend needs new schema can briefly go live
    # before its migration lands, and stays live if the migration fails. Ship
    # schema first (migration-only PR, then the app PR) until Vercel waits on this
    # workflow.
    steps:
      - uses: actions/checkout@v7
      # NOTE: do NOT use `version: latest` — it hits the unauthenticated GitHub
      # API to look up the latest release and gets rate-limited on shared
      # runners. Pin a specific CLI version and bump it deliberately.
      - uses: supabase/setup-cli@v3
        with: { version: 1.226.4 }
      - name: Validate migrations directory (CI-style gate)
        run: node scripts/db-migrations-check.mjs
      # Normalise the token before the CLI sees it. Pasting a secret into the
      # GitHub UI very easily carries a trailing newline or a leading space, and
      # the CLI's only response is "Invalid access token format", which names
      # neither the secret nor the cause. Trim it, then say precisely what is
      # wrong if it still doesn't match — a bad token should cost one glance,
      # not one bisect.
      - name: Normalise + validate SUPABASE_ACCESS_TOKEN
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then
            echo "::error title=SUPABASE_ACCESS_TOKEN is not set::Add it at Settings → Secrets and variables → Actions. Mint one at https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          if ! printf '%s' "$TOKEN" | grep -qE '^sbp_[0-9a-f]{40}$'; then
            echo "::error title=SUPABASE_ACCESS_TOKEN is malformed::After trimming whitespace the stored value is ${#TOKEN} characters; a personal access token is 44 (sbp_ + 40 hex). Re-copy it from https://supabase.com/dashboard/account/tokens with no surrounding quotes or trailing newline. NOTE: this is the ACCOUNT-level token — not the anon key, the service_role key, or SUPABASE_DB_PASSWORD."
            exit 1
          fi
          # Mask the trimmed form too: GitHub only auto-masks the exact stored
          # value, so if the stored one had whitespace the trimmed core would
          # otherwise be unmasked in any later log line.
          echo "::add-mask::$TOKEN"
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Access token format OK."
      # These two inherit the normalised SUPABASE_ACCESS_TOKEN from GITHUB_ENV.
      # Do NOT re-add an `env:` block for it here — that would reinstate the raw
      # secret and undo the trim above.
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Push pending migrations
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}" --include-all

  # Deploy the Supabase Edge Functions. Gated with db-migrations since v10.20.5
  # (it was best-effort, and was silently failing on a stale token for four
  # releases). The deploy itself is idempotent; the runtime WHATSAPP_* /
  # ASK_VYACT_* secrets are configured separately via `supabase secrets set`
  # (see whatsapp-connection-setup.md). The webhook MUST be --no-verify-jwt
  # (Meta has no Supabase JWT); the OTP functions MUST verify JWT (they identify
  # the user), and so MUST `ask-vyact` — it is a paid endpoint that acts as the
  # signed-in caller, and it additionally refuses service-role/anon tokens in
  # code. Deploying `ask-vyact` is SAFE while the agent is off: `ai_model_configs`
  # ships empty with `enabled` defaulting false, so the gateway resolves no model,
  # calls no provider, spends nothing and writes no ai_usage row.
  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    needs: db-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the 6-hour default would drain the Actions budget if a step hangs
    environment: production-database
    # Gated with db-migrations (v10.20.5) — see the note on that job.
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: { version: 1.226.4 }
      # Same normalisation as the db-migrations job — see the note there.
      - name: Normalise SUPABASE_ACCESS_TOKEN
        env:
          RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$TOKEN"
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      # W0 (audit 2026-10-04, OPS-04) — deploy EVERY function directory. This list used to
      # be hand-maintained and never included send-split-email or delete-account, so the
      # v10.59/v10.60 fixes to those two never reached production. Same loop as
      # deploy-test-functions.yml. Everything verifies a JWT except the four below:
      #   whatsapp-webhook        Meta has no Supabase JWT; it checks Meta's signature.
      #   whatsapp-dispatch       pg_cron, no user JWT; checks WHATSAPP_DISPATCH_SECRET or
      #                           the service key in code (v10.42.0).
      #   web-push                pg_cron, no user JWT; every mode checks its own auth
      #                           (member JWT for key/test, Vault cron secret or service key).
      #   recurring-post          pg_cron, no user JWT; checks the Vault cron secret or the
      #                           service key (v10.70.0, posts due bills).
      #   ask-vyact-relay-status  TEST-ONLY relay watcher (TD-44); returns a count only.
      # ask-vyact verifies a JWT and is inert until a super-admin enables an
      # ai_model_configs row; delete-account and send-split-email act as the signed-in user.
      - name: Deploy all Edge Functions
        run: |
          NO_JWT="whatsapp-webhook whatsapp-dispatch web-push recurring-post ask-vyact-relay-status"
          deployed=""
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            case "$fn" in _shared|_*) continue ;; esac
            if [ ! -f "$dir/index.ts" ]; then
              echo "::error title=Function without index.ts::$fn"; exit 1
            fi
            if echo " $NO_JWT " | grep -q " $fn "; then
              supabase functions deploy "$fn" --no-verify-jwt
            else
              supabase functions deploy "$fn"
            fi
            deployed="$deployed $fn"
            echo "::notice title=Deployed::$fn"
          done
          # Every NO_JWT name must still exist; a renamed function would otherwise
          # silently start verifying JWTs and break its caller.
          for fn in $NO_JWT; do
            echo " $deployed " | grep -q " $fn " || { echo "::error title=NO_JWT entry has no function::$fn"; exit 1; }
          done

