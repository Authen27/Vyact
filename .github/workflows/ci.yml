name: CI

# Actions-minutes budget (30 Sep 2026): the repo is private, so CI draws on the
# account's 2,000 free minutes a month (shared with Vyact-Android). Three rules:
#   1. Docs-only changes don't run CI (the `paths` filter below). This is safe
#      because a private repo on GitHub Free has no branch protection, so no
#      required check sits waiting. The docs the gates READ are re-included:
#      version-drift-check (README, VERSIONS, react/CHANGELOG), the scenario
#      catalog + inventory (test-scenarios-check / test-inventory) and
#      WHATSAPP_TEMPLATES.md (whatsappTemplates.test.ts). Add a file here if
#      a gate starts reading it. Order matters: a later pattern overrides an
#      earlier one.
#   2. The E2E lanes run on the pull request only. The push to main after a merge
#      re-runs just the cheap gates job (lint · unit · build · version drift).
#   3. Every job has a timeout-minutes cap. In Sep 2026 a hung Lane A burned 30
#      minutes a run, over 100 times; that, not normal use, was most of the bill.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!automation-runs/**'
      - '!.github/dependabot.yml'
      - 'README.md'
      - 'VERSIONS.md'
      - 'react/CHANGELOG.md'
      - 'docs/TEST_SCENARIOS.md'
      - 'docs/UNIT_TEST_INVENTORY.json'
      - 'docs/WHATSAPP_TEMPLATES.md'
  pull_request:
    branches: [main]
    # Same list as push: above. Keep the two in step.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!automation-runs/**'
      - '!.github/dependabot.yml'
      - 'README.md'
      - 'VERSIONS.md'
      - 'react/CHANGELOG.md'
      - 'docs/TEST_SCENARIOS.md'
      - 'docs/UNIT_TEST_INVENTORY.json'
      - 'docs/WHATSAPP_TEMPLATES.md'

# Cancel duplicate runs for the same PR/branch
# W8d (audit OPS-07): read-only token. No job writes to the repository, issues or PRs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # W8d (OPS-13): never cancel a main run

jobs:
  # Single source of truth for the static + unit + build gates. Runs the
  # governed automation reporter, which writes a readable evidence folder
  # (automation-runs/<ts>__<sha>/report.md) and fails the job on any gate failure.
  # See docs/TEST_GOVERNANCE.md.
  automation:
    name: Automation gates (lint · unit · build) + report
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normally ~2 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install consumer deps
        working-directory: react
        run: npm ci
      - name: Install admin deps
        working-directory: admin
        run: npm ci
      # W8d (audit GATE-05): a RUNTIME dependency with a high or critical advisory fails CI. Moderate is
      # triaged in docs/SECURITY_AUDIT_TRIAGE.md (React Router 6's open-redirect advisory is mitigated by
      # lib/postAuth.ts safeNext; the fix is the v7 major), so the gate starts at high.
      - name: Runtime dependency audit (high and above)
        run: |
          (cd react && npm audit --omit=dev --audit-level=high)
          (cd admin && npm audit --omit=dev --audit-level=high)
      - name: Run automation gates + generate report
        run: node scripts/automation-run.mjs
      # 2 Oct 2026 — the private repo's artifact storage quota filled up and failed passing
      # runs at the upload step. Uploads are best-effort (continue-on-error), retention is
      # shorter, and the two app builds (largest; Vercel builds its own) upload only on failure.
      - name: Upload generated test inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: deterministic-test-inventory
          path: |
            docs/UNIT_TEST_INVENTORY.json
            docs/TEST_SCENARIOS.md
            test-results/
          retention-days: 14
      - name: Upload automation run report (governance evidence)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: automation-run-report
          path: automation-runs/
          retention-days: 30
      - name: Upload consumer build
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: consumer-dist
          path: react/dist
          retention-days: 7
      - name: Upload admin build
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: admin-dist
          path: admin/dist
          retention-days: 7

  e2e:
    name: E2E — Lane A (local-only)
    # PR only: the PR run already tested this change merged onto main. See the
    # minutes-budget note at the top.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normally ~3 min; a hang used to run to 30
    defaults: { run: { working-directory: react } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'   # W8d (OPS-13); v10.137.0: every job reads one Node from .nvmrc
          cache: 'npm'
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E (builds + serves in local-only mode automatically)
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: playwright-report
          path: react/playwright-report
          retention-days: 7

  # ── Lane B · the cloud lane ────────────────────────────────────────────────
  # Lane A has no database, so it cannot exercise a unique index, a CHECK
  # constraint, or RLS — the whole class of bug where "the write silently
  # affected zero rows". Lane B is the only lane that can, and until now it
  # existed as a config and specs with nothing to run it.
  #
  # It targets vyact-test (xdbfzwltqocyljbgztmv), a disposable project pinned in
  # e2e/lane-b/env.ts so a stray VITE_SUPABASE_URL cannot point it at
  # production. It needs no browser and no dev server.
  #
  # GATED ON THE SECRET, and honestly: with SUPABASE_TEST_SERVICE_ROLE_KEY unset
  # the job reports plainly that it is not configured instead of passing
  # silently. A cloud lane that quietly runs zero tests is worse than no lane —
  # that is exactly how the suite once stayed "green" while testing nothing.
  lane-b:
    name: E2E — Lane B (cloud, needs SUPABASE_TEST_SERVICE_ROLE_KEY)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # normally ~1 min
    defaults: { run: { working-directory: react } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22, not 20: Lane B builds a real supabase-js client, and
          # @supabase/realtime-js throws "Node.js 20 detected without native
          # WebSocket support" at createClient() — before a single assertion
          # runs. This surfaced the first time Lane B actually executed
          # (the secret was only set on 2026-09-09); all 10 specs failed
          # identically at e2e/lane-b/fixtures.ts:32. Matches the gate job.
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: react/package-lock.json
      - name: Is Lane B configured?
        id: cfg
        env:
          KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Lane B not configured::Set the SUPABASE_TEST_SERVICE_ROLE_KEY repository secret (service_role key of the vyact-test project) to enable the cloud lane. Skipping — NOT passing."
          fi
      - run: npm ci
        if: steps.cfg.outputs.configured == 'true'
      - name: Run Lane B against vyact-test
        if: steps.cfg.outputs.configured == 'true'
        env:
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: npm run e2e:lane-b
      - name: Upload Lane B report
        if: ${{ steps.cfg.outputs.configured == 'true' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: playwright-report-lane-b
          path: react/playwright-report
          retention-days: 7
