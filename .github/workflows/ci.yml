name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel duplicate runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for the static + unit + build gates. Runs the
  # governed automation reporter, which writes a readable evidence folder
  # (automation-runs/<ts>__<sha>/report.md) and fails the job on any gate failure.
  # See docs/TEST_GOVERNANCE.md.
  automation:
    name: Automation gates (lint · unit · build) + report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install consumer deps
        working-directory: react
        run: npm ci
      - name: Install admin deps
        working-directory: admin
        run: npm ci
      - name: Run automation gates + generate report
        run: node scripts/automation-run.mjs
      - name: Upload generated test inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-test-inventory
          path: |
            docs/UNIT_TEST_INVENTORY.json
            docs/TEST_SCENARIOS.md
            test-results/
          retention-days: 30
      - name: Upload automation run report (governance evidence)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: automation-run-report
          path: automation-runs/
          retention-days: 90
      - name: Upload consumer build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: consumer-dist
          path: react/dist
          retention-days: 7
      - name: Upload admin build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          retention-days: 7

  e2e:
    name: E2E — Lane A (local-only)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: react } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E (builds + serves in local-only mode automatically)
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: react/playwright-report
          retention-days: 7

  # ── Lane B · the cloud lane ────────────────────────────────────────────────
  # Lane A has no database, so it cannot exercise a unique index, a CHECK
  # constraint, or RLS — the whole class of bug where "the write silently
  # affected zero rows". Lane B is the only lane that can, and until now it
  # existed as a config and specs with nothing to run it.
  #
  # It targets vyact-test (xdbfzwltqocyljbgztmv), a disposable project pinned in
  # e2e/lane-b/env.ts so a stray VITE_SUPABASE_URL cannot point it at
  # production. It needs no browser and no dev server.
  #
  # GATED ON THE SECRET, and honestly: with SUPABASE_TEST_SERVICE_ROLE_KEY unset
  # the job reports plainly that it is not configured instead of passing
  # silently. A cloud lane that quietly runs zero tests is worse than no lane —
  # that is exactly how the suite once stayed "green" while testing nothing.
  lane-b:
    name: E2E — Lane B (cloud, needs SUPABASE_TEST_SERVICE_ROLE_KEY)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: react } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: Lane B builds a real supabase-js client, and
          # @supabase/realtime-js throws "Node.js 20 detected without native
          # WebSocket support" at createClient() — before a single assertion
          # runs. This surfaced the first time Lane B actually executed
          # (the secret was only set on 2026-09-09); all 10 specs failed
          # identically at e2e/lane-b/fixtures.ts:32. Matches the gate job.
          node-version: '22.20.0'
          cache: 'npm'
          cache-dependency-path: react/package-lock.json
      - name: Is Lane B configured?
        id: cfg
        env:
          KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Lane B not configured::Set the SUPABASE_TEST_SERVICE_ROLE_KEY repository secret (service_role key of the vyact-test project) to enable the cloud lane. Skipping — NOT passing."
          fi
      - run: npm ci
        if: steps.cfg.outputs.configured == 'true'
      - name: Run Lane B against vyact-test
        if: steps.cfg.outputs.configured == 'true'
        env:
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: npm run e2e:lane-b
      - name: Upload Lane B report
        if: ${{ steps.cfg.outputs.configured == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-lane-b
          path: react/playwright-report
          retention-days: 7
