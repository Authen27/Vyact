name: Secret scan

# W0 (audit 2026-10-04, XC-PRV-01) — a production sb_secret_ key was committed in setup.sh
# (May 2026) and nothing noticed. This job fails any push or PR that adds a secret-shaped
# string. Deliberately NO paths filter (unlike ci.yml): a secret in a .md file must fail
# too. It needs no npm install and takes seconds, so it costs almost no Actions minutes.
# It reports file:line and the kind of secret, never the value.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# W8d (audit OPS-07): read-only token. No job writes to the repository, issues or PRs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # W8d (OPS-13): never cancel a main run

jobs:
  scan:
    name: No secrets in tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Scanner self-test
        run: node --test scripts/__tests__/secret-scan.test.mjs
      - name: Scan every tracked file
        run: node scripts/secret-scan.mjs
