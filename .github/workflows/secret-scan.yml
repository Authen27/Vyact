name: Secret scan

# W0 (audit 2026-10-04, XC-PRV-01) — a production sb_secret_ key was committed in setup.sh
# (May 2026) and nothing noticed. This job fails any push or PR that adds a secret-shaped
# string. Deliberately NO paths filter (unlike ci.yml): a secret in a .md file must fail
# too. It needs no npm install and takes seconds, so it costs almost no Actions minutes.
# It reports file:line and the kind of secret, never the value.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: No secrets in tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
      - name: Scanner self-test
        run: node --test scripts/__tests__/secret-scan.test.mjs
      - name: Scan every tracked file
        run: node scripts/secret-scan.mjs
