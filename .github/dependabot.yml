version: 2
# Monthly, not weekly (30 Sep 2026): each version-update PR runs CI, and the private
# repo now pays for that from the 2,000 free Actions minutes. Security updates are
# not bound by this schedule; they still open as soon as an advisory lands.
updates:
  # Consumer app
  - package-ecosystem: npm
    directory: /react
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      react: { patterns: ['react', 'react-*', '@types/react*'] }
      vite:  { patterns: ['vite', '@vitejs/*'] }
      tailwind: { patterns: ['tailwindcss', 'autoprefixer', 'postcss'] }
    labels: ['dependencies', 'consumer']

  # Admin app
  - package-ecosystem: npm
    directory: /admin
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      react: { patterns: ['react', 'react-*', '@types/react*'] }
      vite:  { patterns: ['vite', '@vitejs/*'] }
    labels: ['dependencies', 'admin']

  # GitHub Actions themselves
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: ['dependencies', 'ci']
