# Vyact GA4 event catalog — single source of truth.
#
# Schema:
#   name           snake_case, ≤ 32 chars
#   description    one-line human summary
#   added_in       semver tag of the release that introduces it
#   params         map of param_name → { type, values?, required? }
#                  type ∈ string | int | bool | enum
#
# Rules:
#   - PII is forbidden. Money goes through bucketAmount() before send.
#   - Adding/removing/renaming an event requires updating this file in the
#     same PR as the track() callsite (CI lint MSR-001 — pending).
#   - Keep alphabetised within each section for review-friendliness.

version: 1
property: G-E3XKWZP850

events:

  # ── Transaction track-picker (Item #1 / #9) ───────────────────────
  - name: txn_modal_opened
    description: User opened the Add/Edit Transaction modal.
    added_in: v7.1
    params:
      surface:
        type: enum
        values: [add_button, keyboard_n, dashboard_cta, recurring, edit_row]
      mode:
        type: enum
        values: [add, edit]

  - name: txn_track_chosen
    description: TrackPicker selection completed.
    added_in: v7.1
    params:
      track:
        type: enum
        values: [expense, income, transfer, investment]
        required: true
      via:
        type: enum
        values: [click, keyboard]

  - name: txn_saved
    description: Transaction successfully written to the adapter.
    added_in: v7.1
    params:
      track:
        type: enum
        values: [expense, income, transfer, investment]
        required: true
      currency: { type: string }            # ISO 4217
      amount_bucket:
        type: enum
        values: ['0-10', '10-100', '100-1k', '1k-10k', '10k+']
        required: true
      category_id: { type: string }         # catalog id only
      account_type:
        type: enum
        values: [checking, savings, credit_card, cash, investment, other]
      has_member: { type: bool }
      has_payment_method: { type: bool }
      duration_ms: { type: int }            # modal_opened → saved

  - name: txn_abandoned
    description: Modal closed without save.
    added_in: v7.1
    params:
      track: { type: enum, values: [expense, income, transfer, investment] }
      reason:
        type: enum
        values: [esc, backdrop, cancel_btn, navigate_away]
      duration_ms: { type: int }

  - name: txn_edited
    description: Existing row updated.
    added_in: v7.1
    params:
      track: { type: enum, values: [expense, income, transfer, investment] }
      fields_changed: { type: int }

  - name: txn_deleted
    description: Row deleted (after confirm).
    added_in: v7.1
    params:
      track: { type: enum, values: [expense, income, transfer, investment] }

  # ── Calculator (Item #6) ──────────────────────────────────────────
  - name: calc_expression_used
    description: Amount field evaluated an arithmetic expression.
    added_in: v7.1
    params:
      operators: { type: int }              # count, NOT contents

  # ── Filters & search (Item #4) ────────────────────────────────────
  - name: filter_applied
    description: User applied one or more filters on a list page.
    added_in: v7.2
    params:
      page:
        type: enum
        values: [transactions, reports, insights]
        required: true
      facets: { type: int }                 # count of active facets
      had_query: { type: bool }

  - name: saved_view_created
    description: User saved a filter combination as a named view.
    added_in: v7.2

  # ── Reports / insights (Item #8) ──────────────────────────────────
  - name: report_period_changed
    description: User switched the Reports period selector.
    added_in: v7.1
    params:
      period:
        type: enum
        values: [day, week, month, quarter, year]
        required: true

  - name: report_drilldown_clicked
    description: Click on a chart slice/bar that opens a filtered list.
    added_in: v7.3
    params:
      chart:
        type: enum
        values: [donut, bar, line, sankey, member_donut]

  - name: insight_dismissed
    description: User dismissed a generated insight card.
    added_in: v7.3
    params:
      insight_kind: { type: string }

  - name: insight_actioned
    description: User clicked the CTA on a generated insight card.
    added_in: v7.3
    params:
      insight_kind: { type: string }
      action: { type: string }

  # ── Onboarding & education (Item #7) ──────────────────────────────
  - name: onboarding_step_completed
    description: User completed an onboarding step.
    added_in: v7.4
    params:
      step: { type: string }
      step_index: { type: int }

  - name: help_tooltip_opened
    description: User opened a contextual help tooltip.
    added_in: v7.4
    params:
      topic: { type: string }

  # ── Cross-cutting ─────────────────────────────────────────────────
  - name: feature_flag_exposure
    description: User encountered a flagged feature (fires once per session).
    added_in: v7.1
    params:
      flag: { type: string, required: true }
      variant:
        type: enum
        values: [on, off, control]
        required: true

  - name: app_error_boundary
    description: ErrorBoundary fallback rendered.
    added_in: v7.1
    params:
      route: { type: string }

user_properties:
  - name: cloud_enabled
    type: bool
    source: '!!import.meta.env.VITE_SUPABASE_URL'
  - name: base_currency
    type: string
    source: profile.baseCurrency
  - name: household_size
    type: int
    source: 'min(members.length, 5)'
  - name: theme
    type: enum
    values: [warm, dark, system]
    source: profile.theme
  - name: app_version
    type: string
    source: package.json#version

privacy:
  forbidden_params:
    - email
    - name
    - description
    - note
    - household_id
    - member_id
    - raw_amount
    - account_number
  bucketing:
    amount: bucketAmount()                  # see react/src/lib/analytics.ts

  # ── Funnel: visit → active household (marketing #5, v10.49.0) ───────
  # Every event also carries `platform` (enum: web | pwa | android-app).
  # Key events in GA4 (#6, #53): sign_up, household_created, first_transaction_logged, member_invited.
  # GA4 user_id (v10.53.0, #55): SHA-256 of the internal user id, set while signed in, cleared on sign-out.
  - name: budget_created
    description: A new budget was created (not an edit).
    added_in: v10.49.0
    params:
      surface: { type: enum, values: [budgets, onboarding] }
      count: { type: int }
  - name: first_transaction_logged
    description: The household's first entry was saved.
    added_in: v10.49.0
    params:
      track: { type: enum, values: [expense, income, transfer, investment] }
  - name: household_created
    description: A household was created — a new account's first household (the database trigger makes it; counted with sign_up, v10.53.0), or one added from the app.
    added_in: v10.49.0
    params:
      segment: { type: enum, values: [individual, household] }
  - name: landing_cta_click
    description: A call to action on the server-rendered landing page (/) was clicked.
    added_in: v10.49.0
    params:
      placement: { type: enum, values: [hero, hero_signed_in, footer, sticky, nav] }
      page: { type: string }
  - name: learn_card_view
    description: A Learn lesson was viewed — on its public page, or in the app's lesson reel.
    added_in: v10.49.0
    params:
      slug: { type: string }
      learn_category: { type: string }
      surface: { type: enum, values: [public, app] }
  - name: learn_cta_click
    description: A call to action on a public Learn page was clicked.
    added_in: v10.49.0
    params:
      placement: { type: enum, values: [try, sticky, nav, footer] }
      page: { type: string }
  - name: landing_cta_click
    description: A call to action on the landing page at "/" was clicked (sign-up links also carry ?ref=landing_<placement>).
    added_in: v10.50.0
    params:
      placement: { type: enum, values: [nav, hero, demo, short_003, short_021, short_027, footer, footer_link] }
      page: { type: string }
  - name: landing_video_play
    description: The 15-second promo under the landing hero was started (poster tapped). Before the app is up, landing.html's boot script sends it; afterwards Landing.tsx does — once per page view either way.
    added_in: v10.108.0
    params:
      page: { type: string }
  - name: learn_video_play
    description: A lesson's video was started on its public page.
    added_in: v10.49.0
    params:
      slug: { type: string }
  - name: member_invited
    description: An invite link to the household was created.
    added_in: v10.49.0
    params:
      invite_role: { type: enum, values: [admin, member, viewer, child] }
  - name: pwa_install
    description: The browser reported the app was installed (appinstalled).
    added_in: v10.49.0
    params: {}
  - name: sign_up
    description: A new account's first signed-in session (email after verification, or Google) — account created < 24 h ago, once per device and once per account (user_metadata.vy_signup_tracked). v10.53.0; was 'first sign-in within 60 s of creation', which missed email users who verified later.
    added_in: v10.49.0
    params:
      method: { type: enum, values: [email, google] }
      ref: { type: string }
  - name: whatsapp_linked
    description: A WhatsApp number was linked to the account.
    added_in: v10.49.0
    params: {}
  # ── Pip (Ask Vyact) answers and the WhatsApp entry point (v10.54.0) ──
  # Never the question or the answer: only the classified intent and the rating.
  # The same ratings are stored in ai_feedback for the admin console.
  - name: ask_feedback
    description: A thumbs up / down on a Pip answer, or taking it back.
    added_in: v10.54.0
    params:
      rating: { type: enum, values: [up, down, none] }
      intent: { type: string }
  - name: ask_copy
    description: A Pip answer was copied.
    added_in: v10.54.0
    params:
      intent: { type: string }
  - name: ask_new_chat
    description: New chat — the conversation was left and a fresh one started.
    added_in: v10.54.0
    params:
      count: { type: int }
  - name: whatsapp_connect_opened
    description: The WhatsApp connect drawer was opened from Pip.
    added_in: v10.54.0
    params:
      surface: { type: string }
  - name: whatsapp_chat_opened
    description: Open WhatsApp was tapped to continue the chat with Pip there.
    added_in: v10.54.0
    params:
      surface: { type: string }
